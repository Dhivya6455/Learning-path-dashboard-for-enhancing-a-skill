# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=learning-path-dashboard-backend

# ===================================================================
# DATABASE CONFIGURATION
# Default: Embedded H2 Database (Ready out-of-the-box)
# MySQL Configuration provided below for direct MySQL connectivity
# ===================================================================

# 1. Active: H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:skillpathdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 2. Alternative: MySQL Database Configuration
# Uncomment the 5 lines below to connect to a local MySQL server:
# spring.datasource.url=jdbc:mysql://localhost:3306/skillpath_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


